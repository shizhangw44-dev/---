<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港北社區共惠時間銀行 - 機智問答挑戰賽</title>
    <!-- 引入 SheetJS 用於在網頁中直接讀取 Excel 題庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: #B0BEC5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            text-align: center;
        }
        .big-title {
            font-size: 32px;
            font-weight: bold;
            color: #002244;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 20px;
            color: #1A365D;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .question-box {
            background-color: #8FBC8F;
            padding: 25px;
            border-radius: 15px;
            border: 3px solid #2C5282;
            font-size: 26px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 25px;
            line-height: 1.5;
            text-align: left;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .quiz-btn {
            flex: 1;
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-o { background-color: #27AE60; }
        .btn-o:hover { background-color: #219653; }
        .btn-x { background-color: #C0392B; }
        .btn-x:hover { background-color: #A93226; }
        .next-btn {
            width: 100%;
            font-size: 24px;
            font-weight: bold;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background-color: #2980B9;
            color: white;
            cursor: pointer;
            margin-top: 15px;
        }
        .next-btn:hover { background-color: #2471A3; }
        .feedback-box {
            padding: 20px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
        }
        .correct-bg { background-color: #A3E4D7; color: #111111; }
        .wrong-bg { background-color: #F5B7B1; color: #111111; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bgm" loop>
        <source src="background_music.mp3" type="audio/mp3">
    </audio>
    <audio id="correct-sound" src="correct.mp3"></audio>
    <audio id="wrong-sound" src="wrong.mp3"></audio>

    <div class="container" id="app">
        <!-- 歡迎畫面 -->
        <div id="welcome-screen">
            <div class="big-title">🌟 港北社區共惠時間銀行 🌟</div>
            <div class="subtitle">機智問答挑戰賽</div>
            <p style="font-size: 18px; color: #555; margin-bottom: 30px;">點擊下方按鈕開始挑戰您的社區知識！</p>
            <button class="next-btn" onclick="startGame()">🚀 開始答題挑戰</button>
        </div>

        <!-- 答題畫面 -->
        <div id="quiz-screen" class="hidden">
            <div id="progress" style="font-size: 18px; font-weight: bold; color: #555; margin-bottom: 15px;"></div>
            <div class="question-box" id="question-text"></div>
            
            <div id="options-area" class="btn-group">
                <button class="quiz-btn btn-o" onclick="submitAnswer('O')">⭕ 正確 (O)</button>
                <button class="quiz-btn btn-x" onclick="submitAnswer('X')">❌ 錯誤 (X)</button>
            </div>

            <div id="result-area" class="hidden">
                <div id="feedback-content"></div>
                <button class="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
            </div>
        </div>

        <!-- 結算畫面 -->
        <div id="score-screen" class="hidden">
            <div class="big-title" style="margin-bottom: 20px;">🏆 挑戰結算 🏆</div>
            <div id="final-score-box" style="font-size: 28px; font-weight: bold; margin-bottom: 25px;"></div>
            <button class="next-btn" onclick="restartGame()">🔄 重新答題</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;

        // 自動載入 Excel 題庫
        async function loadExcel() {
            try {
                let response = await fetch('quiz_bank.xlsx');
                let data = await response.arrayBuffer();
                let workbook = XLSX.read(data, {type: 'array'});
                let sheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[sheetName];
                let json = XLSX.utils.sheet_to_json(worksheet);
                
                questions = json.map(q => ({
                    type: String(q['題型'] || '是非題').trim(),
                    question: String(q['題目'] || '').trim(),
                    taiwanese: String(q['台語題目'] || '').trim(),
                    answer: String(q['正確答案'] || '').trim().toUpperCase(),
                    explanation: String(q['解析'] || '').trim()
                }));
            } catch (e) {
                alert("無法自動載入 quiz_bank.xlsx 題庫，請確認檔案是否已上傳！");
            }
        }

        loadExcel();

        function startGame() {
            if (questions.length === 0) {
                alert("題庫載入中或發生錯誤，請稍候再試！");
                return;
            }
            // 隨機打亂題目
            questions.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;

            // 播放背景音樂
            let bgm = document.getElementById('bgm');
            bgm.volume = 0.4;
            bgm.play().catch(e => console.log("BGM autoplay blocked"));

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            let q = questions[currentIndex];
            document.getElementById('progress').innerText = `📍 第 ${currentIndex + 1} / ${questions.length} 題 [${q.type}]`;
            document.getElementById('question-text'].innerText = q.question;
            
            document.getElementById('options-area').classList.remove('hidden');
            document.getElementById('result-area').classList.add('hidden');

            // 語音朗讀題目
            speakText(`第 ${currentIndex + 1} 題。${q.question}`);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function submitAnswer(userAns) {
            window.speechSynthesis.cancel();
            let q = questions[currentIndex];
            let isCorrect = (userAns === q.answer);

            if (isCorrect) {
                score++;
                document.getElementById('correct-sound').play().catch(e => {});
            } else {
                document.getElementById('wrong-sound').play().catch(e => {});
            }

            document.getElementById('options-area').classList.add('hidden');
            let resultArea = document.getElementById('result-area');
            let feedbackContent = document.getElementById('feedback-content');
            resultArea.classList.remove('hidden');

            if (isCorrect) {
                feedbackContent.className = 'feedback-box correct-bg';
                feedbackContent.innerHTML = `✨ 答對了！讚讚讚！🎉`;
            } else {
                feedbackContent.className = 'feedback-box wrong-bg';
                feedbackContent.innerHTML = `❌ 答錯了！正確答案是：【 ${q.answer} 】<br><br>💡 解析：<br>${q.explanation}`;
            }
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < questions.length) {
                showQuestion();
            } else {
                showScoreScreen();
            }
        }

        function showScoreScreen() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('score-screen').classList.remove('hidden');
            
            let finalScore = Math.round((score / questions.length) * 100);
            let scoreBox = document.getElementById('final-score-box');
            
            if (finalScore >= 80) {
                scoreBox.innerHTML = `💯 最終得分：${finalScore} 分！挑戰成功！<br><br>👑 港北社區共惠時間銀行 👑<br>全體會員 恭喜您！！`;
            } else {
                scoreBox.innerHTML = `💔 最終得分：${finalScore} 分，未達 80 分門檻，再接再勵！`;
            }
        }

        function restartGame() {
            document.getElementById('score-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
